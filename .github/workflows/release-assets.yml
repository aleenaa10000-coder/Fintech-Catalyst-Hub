name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to (e.g. v1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build & upload release tarballs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build
        env:
          NODE_ENV: production

      - name: Build frontend
        run: pnpm --filter @workspace/fintechpresshub run build
        env:
          NODE_ENV: production
          SITE_URL: https://www.fintechpresshub.com

      - name: Package API server dist
        run: |
          tar -czf "api-server-${{ env.RELEASE_TAG }}.tar.gz" \
            -C artifacts/api-server dist
          echo "API server tarball:"
          du -sh "api-server-${{ env.RELEASE_TAG }}.tar.gz"

      - name: Package frontend dist
        run: |
          tar -czf "frontend-${{ env.RELEASE_TAG }}.tar.gz" \
            -C artifacts/fintechpresshub dist/public
          echo "Frontend tarball:"
          du -sh "frontend-${{ env.RELEASE_TAG }}.tar.gz"

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ env.RELEASE_TAG }}" \
            "api-server-${{ env.RELEASE_TAG }}.tar.gz" \
            "frontend-${{ env.RELEASE_TAG }}.tar.gz" \
            --clobber
