name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # `merge_group` fires when GitHub's native merge queue tests a PR rebased
  # onto the latest main on a temporary `gh-readonly-queue/...` branch. Without
  # this trigger the queue would wait forever for a check that never runs.
  merge_group:
  workflow_dispatch:

concurrency:
  # Include event name so a queue run for the same ref doesn't cancel the PR's
  # own ci run (or vice versa) — they have different purposes.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "dir=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          # Exact hit when lock file is unchanged — install is pure linking, ~seconds.
          # Fallback key gives a partial hit when deps change so only the diff downloads.
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap health check
        # Database connectivity and running-services checks are SKIPped in CI
        # (no DATABASE_URL, no listening ports) — that's expected and does not
        # cause the script to fail. We're using bootstrap here as a smoke test
        # that the toolchain + every package's node_modules are in place.
        run: pnpm bootstrap -- --ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm --filter @workspace/fintechpresshub exec vitest run

  build:
    name: Build API server & frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "dir=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        # Compiles the Express backend with esbuild. Catches import errors,
        # missing modules, and bundler failures that tsc --noEmit cannot see
        # (e.g. runtime-only imports that are absent from node_modules).
        run: pnpm --filter @workspace/api-server run build

      - name: Build frontend
        # Runs vite build + prerender. Catches missing imports, broken aliases,
        # and Rollup/Vite bundler errors. The prerender step gracefully no-ops
        # when the API isn't reachable (no DATABASE_URL in CI), so it never
        # blocks the build — only the Vite bundle itself can fail this step.
        run: pnpm --filter @workspace/fintechpresshub run build
        env:
          SITE_URL: https://www.fintechpresshub.com

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "dir=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @workspace/fintechpresshub run build
        env:
          SITE_URL: https://www.fintechpresshub.com

      - name: Run Lighthouse CI
        # lhci autorun: starts Vite preview, collects audits on the URLs in
        # .lighthouserc.cjs, asserts score thresholds, and uploads a shareable
        # report URL to temporary-public-storage (link printed in logs).
        run: pnpm lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  # Single required status check for branch protection rules.
  # Point your branch protection / merge queue at "CI" instead of the
  # individual job names — adding or renaming jobs in future won't require
  # updating branch protection settings.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [typecheck, build, lighthouse]
    # `always()` ensures this job runs even when an upstream job fails or is
    # cancelled, so GitHub sees an explicit failure rather than "skipped".
    if: always()

    steps:
      - name: All jobs passed
        run: |
          if [[ "${{ needs.typecheck.result }}" != "success" || \
                "${{ needs.build.result }}"    != "success" || \
                "${{ needs.lighthouse.result }}" != "success" ]]; then
            echo "typecheck:  ${{ needs.typecheck.result }}"
            echo "build:      ${{ needs.build.result }}"
            echo "lighthouse: ${{ needs.lighthouse.result }}"
            exit 1
          fi
