name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # `merge_group` fires when GitHub's native merge queue tests a PR rebased
  # onto the latest main on a temporary `gh-readonly-queue/...` branch. Without
  # this trigger the queue would wait forever for a check that never runs.
  merge_group:
  workflow_dispatch:

concurrency:
  # Include event name so a queue run for the same ref doesn't cancel the PR's
  # own ci run (or vice versa) — they have different purposes.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap health check
        # Database connectivity and running-services checks are SKIPped in CI
        # (no DATABASE_URL, no listening ports) — that's expected and does not
        # cause the script to fail. We're using bootstrap here as a smoke test
        # that the toolchain + every package's node_modules are in place.
        run: pnpm bootstrap -- --ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm --filter @workspace/fintechpresshub exec vitest run

  build:
    name: Build API server & frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        # Compiles the Express backend with esbuild. Catches import errors,
        # missing modules, and bundler failures that tsc --noEmit cannot see
        # (e.g. runtime-only imports that are absent from node_modules).
        run: pnpm --filter @workspace/api-server run build

      - name: Build frontend
        # Runs vite build + prerender. Catches missing imports, broken aliases,
        # and Rollup/Vite bundler errors. The prerender step gracefully no-ops
        # when the API isn't reachable (no DATABASE_URL in CI), so it never
        # blocks the build — only the Vite bundle itself can fail this step.
        run: pnpm --filter @workspace/fintechpresshub run build
        env:
          SITE_URL: https://www.fintechpresshub.com
