name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, bootstrap & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap health check
        # Database connectivity and running-services checks are SKIPped in CI
        # (no DATABASE_URL, no listening ports) — that's expected and does not
        # cause the script to fail. We're using bootstrap here as a smoke test
        # that the toolchain + every package's node_modules are in place.
        run: pnpm bootstrap -- --ci

      - name: Typecheck
        run: pnpm typecheck
