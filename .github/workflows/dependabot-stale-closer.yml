name: Close stale Dependabot PRs

# Runs weekly (Monday 07:00 UTC) and closes Dependabot PRs that are either:
#   - superseded — another open Dependabot PR bumps the same package to a
#     newer version, making this one redundant.
#   - stale    — open for more than STALE_DAYS calendar days with no
#     human review activity (approvals, non-bot review comments, or merge).
#
# The job leaves a courtesy comment explaining why each PR was closed so
# the team understands what happened when they look back at the PR list.
# It never touches PRs that are already closed or merged.

on:
  schedule:
    # Monday 07:00 UTC — early in the week so the team starts with a clean list.
    - cron: "0 7 * * 1"
  # Allow manual triggering for ad-hoc clean-ups.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  STALE_DAYS: 30

jobs:
  close-stale:
    name: Close stale / superseded Dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Close stale and superseded Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          STALE_DAYS: ${{ env.STALE_DAYS }}
        run: |
          set -euo pipefail

          NOW_EPOCH=$(date +%s)
          STALE_CUTOFF_EPOCH=$(( NOW_EPOCH - STALE_DAYS * 86400 ))

          echo "=== Fetching open Dependabot PRs ==="
          # Fetch all open PRs from dependabot[bot] as JSON.
          OPEN_PRS=$(gh pr list \
            --repo "$REPO" \
            --author "dependabot[bot]" \
            --state open \
            --limit 200 \
            --json number,title,createdAt,url,headRefName)

          PR_COUNT=$(echo "$OPEN_PRS" | jq length)
          echo "Found $PR_COUNT open Dependabot PR(s)."
          if [ "$PR_COUNT" -eq 0 ]; then
            echo "Nothing to do."
            exit 0
          fi

          # ----------------------------------------------------------------
          # Build a map: package_key -> list of (number, target_version)
          # Dependabot PR titles follow the pattern:
          #   "Bump <package> from <old> to <new>"
          #   "Bump <package> and <package2> from <old> to <new>"  (group bumps)
          # We extract the *first* package name as the dedup key.
          # ----------------------------------------------------------------
          echo "=== Detecting superseded PRs ==="

          # We'll track which PR numbers to close and why.
          declare -A CLOSE_REASON  # number -> reason string

          # For each package, collect all open PR numbers that touch it.
          # We use a temp file because bash associative arrays can't hold arrays.
          TMP=$(mktemp -d)
          PACKAGE_PR_FILE="$TMP/pkg_prs.tsv"

          echo "$OPEN_PRS" | jq -r '.[] | "\(.number)\t\(.title)\t\(.createdAt)"' | \
          while IFS=$'\t' read -r num title created_at; do
            # Extract package name from "Bump X from Y to Z" or "bump X in /path"
            pkg=$(echo "$title" | sed -E \
              's/^[Bb]ump[[:space:]]+([^[:space:]]+).*/\1/')
            # Extract target version ("to X.Y.Z") for ordering.
            target=$(echo "$title" | grep -oP '(?<=to )\S+' | head -1 || echo "0")
            echo -e "$pkg\t$num\t$target\t$created_at" >> "$PACKAGE_PR_FILE"
          done

          # For each package that has >1 PR, close all but the newest target.
          if [ -f "$PACKAGE_PR_FILE" ]; then
            # Get distinct packages.
            PACKAGES=$(awk -F'\t' '{print $1}' "$PACKAGE_PR_FILE" | sort -u)
            for pkg in $PACKAGES; do
              ROWS=$(grep -P "^${pkg}\t" "$PACKAGE_PR_FILE" || true)
              COUNT=$(echo "$ROWS" | wc -l)
              if [ "$COUNT" -le 1 ]; then
                continue
              fi
              echo "Package '$pkg' has $COUNT open PRs — finding newest version..."
              # Sort by target version descending (semver-ish); keep the first.
              NEWEST_NUM=$(echo "$ROWS" | \
                sort -t$'\t' -k3 -V -r | \
                head -1 | \
                awk -F'\t' '{print $2}')
              # All others are superseded.
              while IFS=$'\t' read -r _pkg num _ver _date; do
                if [ "$num" != "$NEWEST_NUM" ]; then
                  CLOSE_REASON[$num]="superseded — PR #${NEWEST_NUM} bumps ${pkg} to a newer version"
                fi
              done <<< "$ROWS"
            done
          fi

          # ----------------------------------------------------------------
          # Detect PRs that are stale (open >= STALE_DAYS, no human review).
          # ----------------------------------------------------------------
          echo "=== Detecting stale PRs ==="
          echo "$OPEN_PRS" | jq -r '.[] | "\(.number)\t\(.createdAt)\t\(.url)"' | \
          while IFS=$'\t' read -r num created_at url; do
            # Skip if already marked for closing as superseded.
            if [ -n "${CLOSE_REASON[$num]+set}" ]; then
              continue
            fi

            CREATED_EPOCH=$(date -d "$created_at" +%s 2>/dev/null || \
                            date -jf "%Y-%m-%dT%H:%M:%SZ" "$created_at" +%s 2>/dev/null || \
                            echo 0)
            if [ "$CREATED_EPOCH" -lt "$STALE_CUTOFF_EPOCH" ]; then
              # Check for human reviews (non-bot approvals or review comments).
              HUMAN_REVIEWS=$(gh pr view "$num" --repo "$REPO" \
                --json reviews \
                --jq '[.reviews[] | select(.author.login != "dependabot[bot]")] | length')
              if [ "${HUMAN_REVIEWS:-0}" -eq 0 ]; then
                CLOSE_REASON[$num]="stale — open for more than ${STALE_DAYS} days with no human review"
              fi
            fi
          done

          # ----------------------------------------------------------------
          # Close the PRs and leave an explanation comment.
          # ----------------------------------------------------------------
          CLOSED=0
          for num in "${!CLOSE_REASON[@]}"; do
            reason="${CLOSE_REASON[$num]}"
            echo "Closing PR #${num}: ${reason}"
            gh pr comment "$num" --repo "$REPO" --body \
              "**Automated clean-up:** closing this Dependabot PR because it is ${reason}. Feel free to reopen if you'd like to review it manually."
            gh pr close "$num" --repo "$REPO"
            CLOSED=$(( CLOSED + 1 ))
          done

          echo "=== Done: closed ${CLOSED} PR(s) ==="
