    <!-- Allow Google full snippet + large image previews + video previews in SERPs.
         index,follow is explicit — overrides any proxy-level X-Robots-Tag in
         development/staging environments. On Hostinger production our server
         sends no noindex headers so this is a belt-and-suspenders assertion. -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- Google Search Console verification — replace content value when verifying ownership -->

    <!-- Performance: preconnect to external origins used above-the-fold -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Author headshots and uploads are served via Replit Object Storage, which is
         backed by Google Cloud Storage. Preconnecting eliminates the TCP+TLS handshake
         latency from the critical path for LCP images such as author photos. -->
    <link rel="preconnect" href="https://storage.googleapis.com">
    <link rel="dns-prefetch" href="https://storage.googleapis.com">
    <!-- Blog cover images are commonly served from Unsplash. Preconnect removes
         the TCP+TLS handshake latency from the critical path for LCP images,
         reducing Largest Contentful Paint on blog post pages. dns-prefetch is
         a fallback hint for browsers that don't support preconnect.
         crossorigin is required for cross-origin image preconnects so the
         browser uses the correct CORS credentials mode when connecting. -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
    <link rel="dns-prefetch" href="https://images.unsplash.com">
    <!-- Synchronous font load with font-display:optional.
         "optional" tells the browser: use Inter only if it loads within the
         browser's very short font block period (~100 ms); if it misses that
         window, fall back to "Inter Fallback" (Arial with calibrated metrics)
         permanently for this navigation — no swap, zero CLS.
         Synchronous loading is required for optional to work: async (media=print)
         loads the stylesheet after the first render, which always misses the
         block period and leaves Inter permanently unused.
         The preconnect hints above pre-warm the TCP+TLS handshake so the
         stylesheet download starts as early as possible. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional">
